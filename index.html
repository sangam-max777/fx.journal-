<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIQUID – Trading journal</title><meta name="theme-color" content="#06141B">
<style>
:root{--bg:#06141B;--card:#0e222d;--line:#1f3542;--mut:#8fa1a8;--txt:#d8dedd;--g:#56d6a0;--r:#ff737a;--b:#6db3ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#1a3441,transparent 45%),var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{width:100%;background:#0a1b24;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 10px}
input[type=checkbox]{width:20px;height:20px;margin:0}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
h1,h3{margin:0 0 10px;letter-spacing:-.02em}h1{font-size:26px}h3{font-size:15px}p{margin:0 0 12px}
.btn{background:var(--g);color:#052018;border:0;border-radius:10px;padding:11px 16px;font-weight:700}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.red{background:rgba(255,115,122,.14);color:var(--r)}
.link{background:none;border:0;color:var(--mut);padding:10px 0;text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--b)}.m{color:var(--mut)}small{font-size:11px}
#auth,#app{display:none}#auth{min-height:100vh;place-items:center;padding:16px}#auth form{width:100%;max-width:380px}
main{padding:16px 14px 96px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top select{width:auto;margin:0;max-width:50%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#081a23;border-top:1px solid var(--line);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font-size:11px}nav button span{display:block;font-size:17px}nav button.on{color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{margin:0}.stat b{display:block;font-size:21px;letter-spacing:-.03em}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:11px;color:var(--mut);font-weight:600}th,td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--mut);font-size:16px}.x:hover{color:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.rv{display:grid;grid-template-columns:24px 1fr 110px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.rv input[type=number]{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal i{display:block}.cal .d{min-height:54px;border-radius:8px;padding:4px;font-size:11px;background:#0a1b24}.cal .d b{display:block;font-size:10px}.cal .h{color:var(--mut);font-size:10px;text-align:center}
.col{position:relative;flex:1;height:140px}.col div{position:absolute;left:0;right:0;border-radius:3px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#16303d;border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%}
@media(min-width:800px){nav{top:0;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:22px 10px;gap:2px}nav button{flex:0;text-align:left;font-size:14px;padding:11px 14px;border-radius:10px;display:flex;gap:12px}nav button span{font-size:15px}nav button.on{background:#12303c}main{margin:0 auto 0 190px;padding:26px 34px 40px;max-width:1200px}.stats{grid-template-columns:repeat(4,1fr)}#toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="auth"><form id="authForm" class="card"><h1>LIQUID</h1><p class="m" id="sub"></p>
<input id="nm" placeholder="Your name" autocomplete="name"><input id="em" type="email" placeholder="Email" required autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" required autocomplete="current-password">
<p class="r" id="aerr"></p><button class="btn" id="go" style="width:100%"></button><button type="button" class="btn ghost" id="guest" style="width:100%;margin-top:10px">Continue as guest</button><p class="m" style="margin:8px 0 0"><small>No sign-up needed. Guest data is deleted after 14 days of inactivity, and you can turn it into a full account anytime.</small></p><button type="button" class="link" id="sw"></button></form></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=window.API_BASE||'';
const S={tok:localStorage.getItem('lq_t'),user:null,trades:[],accts:[],acct:'all',view:'dash',cur:localStorage.getItem('lq_c')||'USD',cal:new Date(),review:null,coach:''};
const money=n=>new Intl.NumberFormat(S.cur==='INR'?'en-IN':'en-US',{style:'currency',currency:S.cur}).format(n||0);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2800)};
async function api(p,o={}){const r=await fetch(API+p,{method:o.m||'GET',headers:{'Content-Type':'application/json',...(S.tok?{Authorization:'Bearer '+S.tok}:{})},body:o.b?JSON.stringify(o.b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&S.tok)out();if(!r.ok)throw new Error(d.error||'Request failed.');return d}

/* ---- auth ---- */
let mode='in';
function setMode(m){mode=m;const i=m==='in';$('#nm').style.display=i?'none':'block';$('#sub').textContent=i?'Sign in to your journal.':'Create your journal. Your data stays private to you.';$('#go').textContent=i?'Sign in':'Create account';$('#sw').textContent=i?'New here? Create an account':'Have an account? Sign in';$('#pw').autocomplete=i?'current-password':'new-password';$('#aerr').textContent=''}
$('#sw').onclick=()=>setMode(mode==='in'?'up':'in');
$('#guest').onclick=async()=>{$('#guest').disabled=true;$('#aerr').textContent='';try{const d=await api('/api/auth/guest',{m:'POST'});S.tok=d.token;localStorage.setItem('lq_t',d.token);boot()}catch(x){$('#aerr').textContent=x.message}$('#guest').disabled=false};
$('#authForm').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#aerr').textContent='';
 try{const d=await api('/api/auth/'+(mode==='in'?'login':'register'),{m:'POST',b:{email:$('#em').value,password:$('#pw').value,name:$('#nm').value}});S.tok=d.token;localStorage.setItem('lq_t',d.token);boot()}
 catch(x){$('#aerr').textContent=x.message}$('#go').disabled=false};
function showAuth(){$('#auth').style.display='grid';$('#app').style.display='none';setMode('in')}
function out(){S.tok=null;localStorage.removeItem('lq_t');showAuth()}
async function load(){const[t,a]=await Promise.all([api('/api/trades'),api('/api/accounts')]);S.trades=t.trades;S.accts=a.accounts}
async function boot(){if(!S.tok)return showAuth();try{S.user=(await api('/api/me')).user;await load();$('#auth').style.display='none';$('#app').style.display='block';draw()}catch(e){showAuth()}}

/* ---- data helpers ---- */
const list=()=>S.trades.filter(t=>S.acct==='all'||t.acct===S.acct).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function stats(ts){const w=ts.filter(t=>t.pnl>0),l=ts.filter(t=>t.pnl<0),sum=a=>a.reduce((s,t)=>s+t.pnl,0),gw=sum(w),gl=Math.abs(sum(l));let eq=0,pk=0,dd=0,cu=0,bw=0,bl=0;
 const curve=ts.map(t=>{eq+=t.pnl;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);cu=t.pnl>0?(cu>0?cu+1:1):t.pnl<0?(cu<0?cu-1:-1):0;bw=Math.max(bw,cu);bl=Math.min(bl,cu);return eq});
 return{n:ts.length,net:sum(ts),wr:ts.length?w.length/ts.length*100:0,pf:gl?gw/gl:gw?Infinity:0,aw:w.length?gw/w.length:0,al:l.length?-gl/l.length:0,dd,bw,bl:-bl,curve}}
function days(ts){const m={};ts.forEach(t=>{const d=t.date.slice(0,10);m[d]=(m[d]||0)+t.pnl});return m}
function line(v){if(v.length<2)return'<p class="m">Add at least 2 trades to see your equity curve.</p>';const w=600,h=180,lo=Math.min(0,...v),hi=Math.max(0,...v),k=hi-lo||1,y=x=>h-8-(x-lo)/k*(h-16);
 return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="180" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="#2a4453" stroke-dasharray="4 5"/><polyline points="${v.map((x,i)=>(i/(v.length-1)*w).toFixed(1)+','+y(x).toFixed(1)).join(' ')}" fill="none" stroke="${v[v.length-1]>=0?'#56d6a0':'#ff737a'}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`}
function bars(m){const k=Object.keys(m).sort().slice(-14);if(!k.length)return'<p class="m">No data yet.</p>';const mx=Math.max(...k.map(x=>Math.abs(m[x])))||1;
 return`<div style="display:flex;gap:5px">${k.map(x=>{const v=m[x],p=Math.abs(v)/mx*48;return`<div class="col" title="${x}: ${money(v)}"><div style="${v>=0?'bottom':'top'}:50%;height:${p}%;background:var(--${v>=0?'g':'r'})"></div></div>`}).join('')}</div>`}
function tbl(ts,del){if(!ts.length)return'<p class="m">No trades yet. Add one from the Add tab.</p>';
 return`<div class="tw"><table><tr><th>Symbol</th><th>Side</th><th>Lots</th><th>Entry → exit</th><th>Closed</th><th>P/L</th>${del?'<th></th>':''}</tr>${ts.map(t=>`<tr><td><b>${esc(t.symbol)}</b></td><td class="${t.side==='buy'?'b':'r'}">${t.side}</td><td>${t.lots??'–'}</td><td>${t.entry??'–'} → ${t.exit??'–'}</td><td class="m">${esc(t.date.slice(0,16))}</td><td class="${t.pnl>=0?'g':'r'}">${money(t.pnl)}</td>${del?`<td><button class="x" data-act="del" data-v="${t.id}" aria-label="Delete trade">✕</button></td>`:''}</tr>`).join('')}</table></div>`}

/* ---- views ---- */
const V={
dash(){const ts=list(),s=stats(ts),c=v=>v>=0?'g':'r';
 return`<div class="stats">${[['Net P/L',money(s.net),c(s.net)],['Win rate',s.wr.toFixed(0)+'%',''],['Profit factor',s.pf===Infinity?'∞':s.pf.toFixed(2),''],['Trades',s.n,''],['Average win',money(s.aw),'g'],['Average loss',money(s.al),'r'],['Max drawdown',money(-s.dd),'r'],['Best streak win / loss',s.bw+' / '+s.bl,'']].map(([a,b,k])=>`<div class="card stat"><span class="m">${a}</span><b class="${k}">${b}</b></div>`).join('')}</div>
 <div class="card"><h3>Equity curve</h3>${line(s.curve)}</div><div class="card"><h3>Daily P/L</h3>${bars(days(ts))}</div><div class="card"><h3>Recent trades</h3>${tbl(ts.slice(-6).reverse(),false)}</div>`},
trades(){return`<div class="card"><h3>All trades (${list().length})</h3>${tbl(list().reverse(),true)}</div>`},
add(){const rv=S.review;
 return`<div class="card"><h3>Read P/L with AI</h3><p class="m">Upload your broker history screenshot. AI lists each closed trade. You check, fix anything, then save.</p><input type="file" id="files" accept="image/*" multiple><button class="btn" id="aiBtn" data-act="ai">Read screenshot</button></div>
 ${rv?`<div class="card"><h3>${rv.length?'Check '+rv.length+' trades':'No trades found'}</h3>${rv.map((t,i)=>`<div class="rv" data-i="${i}"><input type="checkbox" checked aria-label="Include trade"><span><b>${esc(t.symbol)}</b> <span class="${t.side==='buy'?'b':'r'}">${t.side}</span> ${t.lots??''}<br><small class="m">${esc(t.date)}</small></span><input type="number" step="any" value="${t.pnl}" aria-label="P/L"></div>`).join('')}${rv.length?'<button class="btn" data-act="save" style="margin-top:12px">Save selected trades</button>':''}</div>`:''}
 <form id="mf" class="card"><h3>Add manually</h3><div class="grid2"><input name="symbol" placeholder="Symbol (e.g. EURUSD)" required><select name="side"><option value="buy">Buy</option><option value="sell">Sell</option></select>
 <input name="lots" type="number" step="any" placeholder="Lots"><input name="pnl" type="number" step="any" placeholder="P/L (loss as −)" required><input name="entry" type="number" step="any" placeholder="Entry"><input name="exit" type="number" step="any" placeholder="Exit"></div>
 <input name="date" type="datetime-local" aria-label="Close time"><textarea name="note" rows="2" placeholder="Why did you take it? How did you feel?"></textarea><button class="btn">Save trade</button></form>`},
cal(){const y=S.cal.getFullYear(),mo=S.cal.getMonth(),m=days(list()),f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();let c='',tot=0;
 for(let i=0;i<f;i++)c+='<i></i>';
 for(let d=1;d<=n;d++){const k=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,v=m[k];if(v!=null)tot+=v;
  c+=`<div class="d" ${v==null?'':`style="background:rgba(${v>=0?'86,214,160':'255,115,122'},.2)"`}>${d}${v==null?'':`<b class="${v>=0?'g':'r'}">${v.toFixed(Math.abs(v)>=100?0:2)}</b>`}</div>`}
 return`<div class="card"><div class="top"><button class="btn ghost" data-act="mon" data-v="-1" aria-label="Previous month">‹</button><h3 style="margin:0;text-align:center">${S.cal.toLocaleString('en',{month:'long',year:'numeric'})}<br><small class="${tot>=0?'g':'r'}">${money(tot)}</small></h3><button class="btn ghost" data-act="mon" data-v="1" aria-label="Next month">›</button></div>
 <div class="cal">${['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')}${c}</div></div>`},
ins(){const ts=list(),m={};ts.forEach(t=>{const x=m[t.symbol]??={n:0,w:0,p:0};x.n++;x.w+=t.pnl>0?1:0;x.p+=t.pnl});const k=Object.keys(m).sort((a,b)=>m[b].p-m[a].p);
 return`<div class="card"><h3>By instrument</h3>${k.length?`<div class="tw"><table><tr><th>Symbol</th><th>Trades</th><th>Win rate</th><th>Net P/L</th></tr>${k.map(s=>`<tr><td><b>${esc(s)}</b></td><td>${m[s].n}</td><td>${(m[s].w/m[s].n*100).toFixed(0)}%</td><td class="${m[s].p>=0?'g':'r'}">${money(m[s].p)}</td></tr>`).join('')}</table></div>`:'<p class="m">No data yet.</p>'}</div>
 <div class="card"><h3>AI coach</h3><p class="m">Reads your last 60 trades and flags habits like overtrading and revenge entries.</p><button class="btn" id="coachBtn" data-act="coach">Review my trading</button>${S.coach?`<p style="white-space:pre-wrap;margin-top:14px">${esc(S.coach)}</p>`:''}</div>`},
set(){return`${S.user.guest?`<form id="ug" class="card"><h3>Save your account</h3><p class="m">Add an email and password to keep your trades permanently and remove the AI limit.</p><input name="name" placeholder="Your name" autocomplete="name"><input name="email" type="email" placeholder="Email" required autocomplete="email"><input name="password" type="password" placeholder="Password (8+ characters)" minlength="8" required autocomplete="new-password"><button class="btn">Create account and keep my data</button></form>`:''}<div class="card"><h3>Profile</h3><p>${esc(S.user.name)}<br><span class="m">${esc(S.user.email||'Not saved yet')}</span></p><label class="m" for="cur">Display currency (label only)</label><select id="cur">${['USD','INR','EUR','GBP'].map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="card"><h3>Accounts</h3>${S.accts.map(a=>`<p>${esc(a.name)} <button class="x" data-act="dela" data-v="${a.id}" aria-label="Delete account">✕</button></p>`).join('')||'<p class="m">No accounts yet. Add one to separate demo, live or prop trades.</p>'}<form id="af" style="display:flex;gap:8px"><input name="name" placeholder="Account name" required style="margin:0"><button class="btn">Add</button></form></div>
 <div class="card"><h3>Your data</h3><button class="btn ghost" data-act="exp">Export CSV</button> <button class="btn red" data-act="wipe">Delete all trades</button></div><button class="btn ghost" data-act="out" style="width:100%">Sign out</button>`}};
const NAV=[['dash','▦','Home'],['trades','↕','Trades'],['add','＋','Add'],['cal','▤','Calendar'],['ins','◔','Insights'],['set','⚙','Settings']];
function draw(){const t=NAV.find(n=>n[0]===S.view);$('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===S.view?'on':''}" data-act="go" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
 $('#main').innerHTML=`<div class="top"><h1>${t[2]==='Home'?'Dashboard':t[2]}</h1><select id="acct" aria-label="Account"><option value="all">All accounts</option>${S.accts.map(a=>`<option value="${a.id}" ${a.id===S.acct?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`+(S.user.guest&&S.view!=='set'?'<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>Guest account</b><br><small class="m">Deleted after 14 idle days. AI limited to 5 uses.</small></span><button class="btn" data-act="go" data-v="set">Save it</button></div>':'')+V[S.view]()}

/* ---- actions ---- */
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,2000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};i.onerror=()=>no(new Error('Could not open that image.'));i.src=URL.createObjectURL(f)});
async function addTrades(rows){const d=await api('/api/trades',{m:'POST',b:{trades:rows,acct:S.acct}});toast(`Added ${d.added}${d.skipped?`, skipped ${d.skipped} duplicates`:''}`);await load()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 try{
  if(a==='go'){S.view=v;draw()}
  else if(a==='mon'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+(+v),1);draw()}
  else if(a==='del'){await api('/api/trades/'+v,{m:'DELETE'});await load();draw()}
  else if(a==='ai'){const fs=[...$('#files').files];if(!fs.length)return toast('Choose a P/L screenshot first.');b.disabled=true;b.textContent='Reading…';
   try{const d=await api('/api/analyze',{m:'POST',b:{images:await Promise.all(fs.map(shrink))}});S.review=d.trades}finally{draw()}}
  else if(a==='save'){const rows=[...document.querySelectorAll('.rv')].filter(r=>r.querySelector('[type=checkbox]').checked).map(r=>({...S.review[+r.dataset.i],pnl:parseFloat(r.querySelector('[type=number]').value)||0}));
   if(!rows.length)return toast('Select at least one trade.');await addTrades(rows);S.review=null;S.view='trades';draw()}
  else if(a==='coach'){b.disabled=true;b.textContent='Thinking…';try{S.coach=(await api('/api/coach',{m:'POST'})).text}finally{draw()}}
  else if(a==='dela'){await api('/api/accounts/'+v,{m:'DELETE'});if(S.acct===v)S.acct='all';await load();draw()}
  else if(a==='exp'){const csv=['symbol,side,lots,entry,exit,pnl,date,note',...S.trades.map(t=>[t.symbol,t.side,t.lots,t.entry,t.exit,t.pnl,t.date,'"'+(t.note||'').replace(/"/g,'""')+'"'].join(','))].join('\n');
   const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download='liquid-trades.csv';l.click()}
  else if(a==='wipe'){if(confirm('Delete every trade? This cannot be undone.')){await api('/api/trades',{m:'DELETE'});await load();draw();toast('All trades deleted.')}}
  else if(a==='out'){if(!S.user.guest||confirm('Guest data cannot be recovered after signing out. Sign out anyway? (Cancel, then save your account first.)'))out()}
 }catch(x){toast(x.message)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
 try{
  if(f.id==='mf'){const d=Object.fromEntries(new FormData(f));await addTrades([d]);f.reset();draw()}
  if(f.id==='af'){await api('/api/accounts',{m:'POST',b:{name:f.name.value}});await load();draw()}
  if(f.id==='ug'){S.user=(await api('/api/auth/upgrade',{m:'POST',b:Object.fromEntries(new FormData(f))})).user;toast('Account saved. Your trades are safe.');draw()}
 }catch(x){toast(x.message)}});
document.addEventListener('change',e=>{if(e.target.id==='acct'){S.acct=e.target.value;draw()}if(e.target.id==='cur'){S.cur=e.target.value;localStorage.setItem('lq_c',S.cur);draw()}});
boot();
</script></body></html>
