const rst=()=>{try{const o=JSON.parse($("#bk").value);D=o.D;RS=o.RS||RS;sv();go()}catch(e){$("#bk").value="Could not read that backup text."}};
const gd=()=>`<div class="card gd"><h3>Workflow</h3><ol><li>Before entry: New trade, fill Pre-trade plan, leave Gross P&L blank (the trade is “open”).</li><li>After close: add actual entry and exit, gross P&L from your broker, fees and swap, then the review.</li><li>The dashboard counts only closed trades (gross P&L filled) and updates from the log.</li></ol><h3>Metric formulas</h3><table><tr><td>Net P&L</td><td>Σ (Gross P&L − Fees + swap), per trade and in total</td></tr><tr><td>R per trade</td><td>Net P&L ÷ Planned risk ($). Costs are inside Net, so fees reduce R</td></tr><tr><td>Total R</td><td>Σ R over trades with valid R</td></tr><tr><td>Win rate</td><td>Trades with Net &gt; 0 ÷ closed trades (breakeven is not a win)</td></tr><tr><td>Avg win / loss</td><td>Mean Net of winners / mean Net of losers. Payoff ratio = avg win ÷ |avg loss|</td></tr><tr><td>Expectancy (R)</td><td>Total R ÷ trades with valid R, which equals win% × avg win R − loss% × avg loss R</td></tr><tr><td>Profit factor</td><td>Σ winning Net ÷ |Σ losing Net|</td></tr><tr><td>Max drawdown</td><td>Largest fall from a cumulative-R peak (peak starts at 0). The dollar figure uses cumulative Net P&L</td></tr><tr><td>Slippage</td><td>Long: actual entry − planned entry. Short: planned − actual. Positive means a worse fill</td></tr><tr><td>Plan adherence</td><td>Trades marked “Yes” ÷ closed trades</td></tr></table><h3 style="margin-top:12px">Rules</h3><ul><li><b>Partial exits:</b> keep one row per position. Gross = sum of every exit’s P&L, Actual exit = size-weighted average price, Fees = all commission and swap. Planned risk is the initial risk on the full position; do not shrink it when you move a stop.</li><li><b>Fees:</b> commission plus swap. Spread is already in your fills.</li><li><b>Missing data:</b> required fields (*) show in Data quality. Blank fees count as $0 until filled. No gross P&L means the trade is open and excluded.</li><li><b>Zero or blank planned risk:</b> R cannot be calculated, so the trade is excluded from R, expectancy, drawdown and the R histogram. It stays in dollar metrics and is flagged.</li><li><b>Small samples:</b> below about 30 trades overall and 20 per group, win rate, expectancy, profit factor and breakdowns are unreliable. History is a record, not a prediction.</li><li><b>Sessions:</b> pick one rule and keep it, for example Asia 00–08 UTC, London 08–16, New York 13–21, Overlap 13–16 (IST = UTC+5:30).</li><li><b>Storage:</b> data lives in this browser only. Back up often; clearing browser data erases it.</li></ul><h3>Backup</h3><textarea id="bk" rows="4"></textarea><div class="fl" style="margin-top:8px"><button onclick="$('#bk').value=JSON.stringify({D,RS})">Show backup text</button><button onclick="rst()">Restore from box</button></div></div>`;
